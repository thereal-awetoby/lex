[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
optimizer = true
# Low runs favor small bytecode: Mandate must stay under the 24,576-byte limit.
optimizer_runs = 1
evm_version = "paris"
solc_version = "0.8.24"
via_ir = true
# Omit CBOR metadata to preserve deployment size headroom.
cbor_metadata = false
bytecode_hash = "none"

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[rpc_endpoints]
hsk_mainnet = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

# Use --verifier blockscout --verifier-url https://hsk.blockscout.com/api/
