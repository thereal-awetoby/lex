[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
optimizer = true
optimizer_runs = 200
evm_version = "paris"
solc_version = "0.8.24"
via_ir = true

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[rpc_endpoints]
hsk_mainnet = "${HSK_RPC_URL}"
hsk_testnet = "${HSK_TESTNET_RPC_URL}"

[etherscan]
hsk_mainnet = { key = "${EXPLORER_API_KEY}", url = "${EXPLORER_API_URL}" }
